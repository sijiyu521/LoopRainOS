# ============================================
# LoopRainOS Docker 部署配置
# 用法: docker-compose up -d --build
# ============================================
version: "3.8"

services:
  # 后端 API 服务
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: looprainos-backend
    restart: unless-stopped
    ports:
      - "8079:8079"
    volumes:
      - backend_data:/app/server/data
    environment:
      - NODE_ENV=production
      - PORT=8079
    networks:
      - looprainos

  # 前端 (Nginx) 服务
  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    container_name: looprainos-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - looprainos

volumes:
  backend_data:

networks:
  looprainos:
    driver: bridge