# LoopRainOS 部署配置

# ========== 服务器信息 ==========
# 修改以下变量为你的实际服务器信息
SERVER_HOST="your-server-ip"
SERVER_USER="root"
SERVER_PORT="22"
# 部署目标路径
DEPLOY_PATH="/var/www/looprainos"

# SSH 密钥路径（如果使用密钥认证）
SSH_KEY="~/.ssh/id_rsa"

# ========== 部署选项 ==========
# 部署模式: static(仅前端), full(前端+后端), docker
DEPLOY_MODE="static"

# 后端端口
BACKEND_PORT=8079
# 前端端口（Nginx 监听）
FRONTEND_PORT=80